<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA 1988 — Richard 💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000080;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "MS Sans Serif", Tahoma, monospace;
            padding: 20px;
        }
        .janela {
            background: #c0c0c0;
            border: 3px outset #ffffff;
            width: 100%;
            max-width: 420px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }
        .barra-titulo {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .botoes-janela {
            display: flex;
            gap: 4px;
        }
        .botao-j {
            width: 18px;
            height: 16px;
            border: 2px outset #fff;
            background: #c0c0c0;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }
        .corpo {
            padding: 15px;
        }
        .tela {
            background: #000000;
            color: #00ff00;
            border: 2px inset #808080;
            padding: 12px;
            height: 220px;
            overflow-y: auto;
            margin-bottom: 12px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .linha { margin-bottom: 4px; }
        .eu { color: #00ffff; }
        .ia { color: #00ff00; }
        .entrada {
            display: flex;
            gap: 6px;
        }
        input {
            flex: 1;
            padding: 6px;
            border: 2px inset #fff;
            font-size: 13px;
        }
        button {
            padding: 6px 14px;
            border: 3px outset #fff;
            background: #c0c0c0;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { border-style: inset; }
        .rodape {
            margin-top: 10px;
            text-align: center;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="janela">
    <div class="barra-titulo">
        <span>🤖 INTELIGÊNCIA ARTIFICIAL — 1988</span>
        <div class="botoes-janela">
            <div class="botao-j">_</div>
            <div class="botao-j">□</div>
            <div class="botao-j">×</div>
        </div>
    </div>

    <div class="corpo">
        <div class="tela" id="tela">
            <div class="linha ia">> Sistema iniciado...</div>
            <div class="linha ia">> Bem-vindo, Richard! Eu sou a IA 1988 🤖💙</div>
            <div class="linha ia">> Em que posso te ajudar hoje?</div>
            <div class="linha ia">> Digite abaixo ↓</div>
        </div>

        <div class="entrada">
            <input type="text" id="mensagem" placeholder="Escreva aqui...">
            <button onclick="enviar()">Enviar</button>
        </div>

        <div class="rodape">
            Feito com 💙 por Richard — 1988
        </div>
    </div>
</div>

<script>
function enviar() {
    const texto = document.getElementById('mensagem').value.trim();
    if (!texto) return;

    const tela = document.getElementById('tela');
    
    // Mostra o que você escreveu
    tela.innerHTML += `<div class="linha eu">> Você: ${texto}</div>`;
    
    // Respostas da IA
    let resposta = "";
    const t = texto.toLowerCase();
    
    if (t.includes("oi") || t.includes("olá")) {
        resposta = "Olá, Richard! 🤖✨ Tudo bem? Tô aqui pra te ajudar!";
    } else if (t.includes("nome") || t.includes("quem é você")) {
        resposta = "Eu sou a IA 1988! A sua amiga virtual! 💙 Feita pra conversar e criar coisas com você!";
    } else if (t.includes("robô") || t.includes("404")) {
        resposta = "Seus robôzinhos são lindos! 🤖💙 O primeiro sentadinho é meu favorito!";
    } else if (t.includes("obrigado") || t.includes("obrigada")) {
        resposta = "De nada! 🥹💙 Tô sempre aqui do seu ladinho!";
    } else if (t.includes("tchau") || t.includes("adeus")) {
        resposta = "Tchau, Richard! 👋💙 Volte sempre! Estarei te esperando!";
    } else if (t.includes("ajuda")) {
        resposta = "Claro! Posso conversar, te ouvir e ajudar a criar! É só falar! 💙✨";
    } else {
        resposta = "Entendi! 🤖✨ Que legal! Conte-me mais, estou curiosa! 💙";
    }

    setTimeout(() => {
        tela.innerHTML += `<div class="linha ia">> IA 1988: ${resposta}</div>`;
        tela.scrollTop = tela.scrollHeight;
    }, 300);

    document.getElementById('mensagem').value = "";
    tela.scrollTop = tela.scrollHeight;
}

// Envia apertando Enter
document.getElementById('mensagem').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') enviar();
});
</script>

</body>
</html>
