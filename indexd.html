<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google+ — Compartilhe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    color: #333;
  }

  /* Cabeçalho */
  .cabecalho {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #4285f4;
  }
  .logo span:nth-child(2) { color: #ea4335; }
  .logo span:nth-child(3) { color: #fbbc05; }
  .logo span:nth-child(4) { color: #4285f4; }
  .logo span:nth-child(5) { color: #34a853; }
  .mais { color: #ea4335; font-weight: bold; }

  .navegacao {
    display: flex;
    gap: 20px;
    font-size: 14px;
  }
  .navegacao a {
    text-decoration: none;
    color: #666;
    padding: 8px 12px;
    border-radius: 4px;
  }
  .navegacao a.ativo {
    background: #e8f0fe;
    color: #4285f4;
    font-weight: bold;
  }

  .usuario {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #4285f4;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  /* Conteúdo */
  .conteudo {
    max-width: 650px;
    margin: 20px auto;
    padding: 0 15px;
  }

  .caixa-post {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
  }
  .caixa-post textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px;
    font-size: 14px;
    resize: none;
    height: 80px;
    margin-bottom: 10px;
  }
  .btn-publicar {
    background: #4285f4;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-publicar:hover { background: #3367d6; }

  .post {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .cab-post {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .nome { font-weight: bold; font-size: 14px; }
  .hora { color: #999; font-size: 12px; }
  .texto-post { font-size: 14px; line-height: 1.5; margin-bottom: 10px; }

  .acoes {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: #666;
  }
  .acoes span { cursor: pointer; }
  .acoes span:hover { color: #4285f4; }

  .voltar {
    display: inline-block;
    margin: 15px;
    color: #4285f4;
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>
<body>

<a href="indexmsn2.html" class="voltar">← Voltar para o MSN</a>

<header class="cabecalho">
  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    <span class="mais">+</span>
  </div>
  <nav class="navegacao">
    <a href="#" class="ativo">Página Inicial</a>
    <a href="#">Pessoas</a>
    <a href="#">Coleções</a>
    <a href="#">Comunidades</a>
  </nav>
  <div class="usuario">
    <span>Richard</span>
    <div class="avatar">R</div>
  </div>
</header>

<main class="conteudo">
  <!-- Caixa para postar -->
  <div class="caixa-post">
    <textarea id="novoPost" placeholder="Compartilhe algo com seus círculos..."></textarea>
    <button class="btn-publicar" onclick="publicar()">Publicar</button>
  </div>

  <!-- Postagens -->
  <div id="feed">
    <div class="post">
      <div class="cab-post">
        <div class="avatar">R</div>
        <div>
          <div class="nome">Richard</div>
          <div class="hora">Agora mesmo</div>
        </div>
      </div>
      <div class="texto-post">Bem-vindo ao Google+! 💙✨ Que bom ter você aqui!</div>
      <div class="acoes">
        <span>👍 +1</span>
        <span>💬 Comentar</span>
        <span>↗ Compartilhar</span>
      </div>
    </div>
  </div>
</main>

<script>
function publicar() {
  const texto = document.getElementById('novoPost').value.trim();
  if (!texto) {
    alert('Escreva algo primeiro! ✏️');
    return;
  }

  const feed = document.getElementById('feed');
  const agora = new Date();
  const horario = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  const novoPost = document.createElement('div');
  novoPost.className = 'post';
  novoPost.innerHTML = `
    <div class="cab-post">
      <div class="avatar">R</div>
      <div>
        <div class="nome">Richard</div>
        <div class="hora">Agora mesmo</div>
      </div>
    </div>
    <div class="texto-post">${texto}</div>
    <div class="acoes">
      <span>👍 +1</span>
      <span>💬 Comentar</span>
      <span>↗ Compartilhar</span>
    </div>
  `;

  feed.insertBefore(novoPost, feed.firstChild);
  document.getElementById('novoPost').value = '';
}
</script>

</body>
</html>
